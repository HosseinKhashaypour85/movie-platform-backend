components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Standard user and admin JWT access token.
        Pass in header: `Authorization: Bearer <access_token>`
    workerAuth:
      type: http
      scheme: bearer
      description: |
        Internal worker token configured via `SUBTITLE_WORKER_TOKEN`.
        Pass in header: `Authorization: Bearer <worker_token>`

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: invalid_input
            message:
              type: string
              example: name, email or password is invalid

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Hosein Khashayarpour
        email:
          type: string
          format: email
          example: hosein@example.com
        role:
          type: string
          enum: [user, admin, super_admin]
          example: user
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Genre:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Sci-Fi
        slug:
          type: string
          example: sci-fi
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Movie:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Inception
        original_title:
          type: string
          example: Inception
        slug:
          type: string
          example: inception-2010
        synopsis:
          type: string
          example: A thief who steals corporate secrets through the use of dream-sharing technology...
        release_year:
          type: integer
          example: 2010
        duration_minutes:
          type: integer
          example: 148
        age_rating:
          type: string
          example: PG-13
        poster_url:
          type: string
          example: https://example.com/posters/inception.jpg
        backdrop_url:
          type: string
          example: https://example.com/backdrops/inception.jpg
        language:
          type: string
          example: English
        country:
          type: string
          example: United States
        imdb_rating:
          type: number
          format: float
          example: 8.8
        is_published:
          type: boolean
          example: true
        published_at:
          type: string
          format: date-time
          nullable: true
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MovieInput:
      type: object
      required:
        - title
        - slug
      properties:
        title:
          type: string
          maxLength: 240
          example: Inception
        original_title:
          type: string
          maxLength: 240
          example: Inception
        slug:
          type: string
          maxLength: 260
          example: inception-2010
        synopsis:
          type: string
          example: A mind-bending thriller by Christopher Nolan.
        release_year:
          type: integer
          example: 2010
        duration_minutes:
          type: integer
          example: 148
        age_rating:
          type: string
          example: PG-13
        poster_url:
          type: string
          example: https://example.com/posters/inception.jpg
        backdrop_url:
          type: string
          example: https://example.com/backdrops/inception.jpg
        language:
          type: string
          example: English
        country:
          type: string
          example: United States
        imdb_rating:
          type: number
