openapi: 3.0.3
info:
  title: Movie Platform Backend API
  version: 1.0.0
  description: |
    Comprehensive API documentation for the Movie and Series Streaming Platform Backend.
    Built with Go, Chi router, GORM, MySQL, and S3-compatible Object Storage.
    
    This document is fully compatible with **Bruno** (Import Collection -> OpenAPI V3 Spec),
    Swagger UI, Postman, and other OpenAPI tools.
servers:
  - url: http://localhost:8080
    description: Local Development Server

security:
  - bearerAuth: []

tags:
  - name: System & Health
    description: Health checks and root diagnostics
  - name: Auth & Sessions
    description: Authentication, registration, JWT tokens, session lifecycle and logout
  - name: User Profile
    description: Current user profile management and password change
  - name: Catalog (Public)
    description: Public movies, series, seasons, and episodes discovery
  - name: Media & Playback
    description: Signed HLS playback URLs and public subtitles
  - name: Ads (Public)
    description: Active advertising campaigns serving and event tracking
  - name: Engagement
    description: Ratings and user favorite movies
  - name: Watch History
    description: Video watch progress tracking for movies and series episodes
  - name: Notifications (User)
    description: In-app user notifications and read receipt management
  - name: Admin Dashboard & Analytics
    description: System metrics, overview statistics, and analytics
  - name: Admin Audit Logs
    description: Security audit trails for administrative mutation operations
  - name: Admin Users
    description: User management, role assignment, and account activation
  - name: Admin Genres
    description: Genre management for categorization
  - name: Admin Movies
    description: Movie catalog management CRUD
  - name: Admin Series & Episodes
    description: TV series, seasons, and episodes management CRUD
  - name: Admin Media & Uploads
    description: Presigned S3 uploads, upload verification, and subtitle AI jobs
  - name: Admin Ads
    description: Administrative management of ad campaigns
  - name: Admin Notifications
    description: Broadcast notification delivery to all users
  - name: Internal Worker
    description: Subtitle processing worker claim and completion endpoints

paths:
  /:
    get:
      tags:
        - System & Health
      summary: Root Service Status
      security: []
      responses:
        '200':
          description: Service running confirmation
          content:
            application/json:
              example:
                service: movie-platform-api
                status: running

  /health/live:
    get:
      tags:
        - System & Health
      summary: Liveness Probe
      security: []
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              example:
                status: alive

  /health/ready:
    get:
      tags:
        - System & Health
      summary: Readiness Probe
      description: Verifies active database connection pool responsiveness.
      security: []
      responses:
        '200':
          description: Database and dependencies ready
          content:
            application/json:
              example:
                status: ready
        '503':
          description: Dependencies unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      tags:
        - Auth & Sessions
      summary: Register New User
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Hosein Khashayarpour
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: hosein@example.com
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
                  example: SuperSecurePass123!
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Auth & Sessions
      summary: User Login
      description: Returns a short-lived JWT access token and a rotating refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: hosein@example.com
                password:
                  type: string
                  example: SuperSecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 900
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth & Sessions
      summary: Refresh Access Token
      description: Exchanges a valid refresh token for a new access token and rotated refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: 3b1a8d0e5c9f...
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 900
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth & Sessions
      summary: Logout Current Session
      description: Revokes the specified refresh token session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Session revoked successfully
        '401':
          description: Unauthorized

  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth & Sessions
      summary: Logout All Sessions
      description: Revokes all active refresh token sessions for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked successfully
        '401':
          description: Unauthorized

  /api/v1/profile:
    get:
      tags:
        - User Profile
      summary: Get Current User Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    patch:
      tags:
        - User Profile
      summary: Update Profile Name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Hosein Khashayarpour
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
        '400':
          description: Validation error

  /api/v1/profile/change-password:
    post:
      tags:
        - User Profile
      summary: Change Password
      description: Validates current password and updates to new password, revoking all other active sessions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  example: OldPassword123!
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 72
                  example: NewSecurePassword2026!
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Incorrect current password or invalid new password

  /api/v1/catalog/movies:
    get:
      tags:
        - Catalog (Public)
      summary: List Published Movies
      security: []
      parameters:
        - name: q
          in: query
          description: Search term matching title or original title
          schema:
            type: string
        - name: genre_id
          in: query
          description: Filter by genre ID
          schema:
            type: integer
        - name: year
          in: query
          description: Filter by release year
          schema:
            type: integer
        - name: limit
          in: query
          description: Page size (1 to 100, default 20)
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of records to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of published movies
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
                  total:
                    type: integer
                    example: 45

  /api/v1/catalog/movies/{id}:
    get:
      tags:
        - Catalog (Public)
      summary: Get Movie By ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Movie details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid ID
        '404':
          description: Movie not found

  /api/v1/catalog/series:
    get:
      tags:
        - Catalog (Public)
      summary: List Published Series
      security: []
      parameters:
        - name: q
          in: query
          description: Search term matching title or original title
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of series
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Series'
                  total:
                    type: integer

  /api/v1/catalog/series/{id}:
    get:
      tags:
        - Catalog (Public)
      summary: Get Series By ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Series details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '404':
          description: Series not found

  /api/v1/catalog/series/{id}/seasons:
    get:
      tags:
        - Catalog (Public)
      summary: List Seasons of a Series
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Series ID
          schema:
            type: integer
      responses:
        '200':
          description: Seasons list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Season'

  /api/v1/catalog/seasons/{id}/episodes:
    get:
      tags:
        - Catalog (Public)
      summary: List Episodes of a Season
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Season ID
          schema:
            type: integer
      responses:
        '200':
          description: Episodes list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Episode'

  /api/v1/media/{kind}/{id}/subtitles:
    get:
      tags:
        - Media & Playback
      summary: List Subtitles for Content
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [movies, episodes]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Available subtitles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subtitle'

  /api/v1/playback/{kind}/{id}:
    get:
      tags:
        - Media & Playback
      summary: Get Signed HLS Playback Manifest
      description: Generates a short-lived HMAC-signed HLS manifest URL for protected media streaming.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [movies, episodes]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Signed playback URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset_id:
                    type: integer
                  format:
                    type: string
                    example: hls
                  manifest_url:
                    type: string
                    example: https://cdn.example.com/movies/1/video/master.m3u8?expires=1700000300&signature=...
                  expires_at:
                    type: string
                    format: date-time
        '404':
          description: Playable content not found

  /api/v1/ads:
    get:
      tags:
        - Ads (Public)
      summary: Serve Active Ads by Placement
      security: []
      parameters:
        - name: placement
          in: query
          required: true
          description: Ad slot placement (e.g., player_pre_roll, home_banner, sidebar)
          schema:
            type: string
            example: player_pre_roll
      responses:
        '200':
          description: Active ad campaigns for this placement
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'

  /api/v1/ads/{id}/events:
    post:
      tags:
        - Ads (Public)
      summary: Track Ad Event (Impression or Click)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Campaign ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum: [impression, click]
                placement:
                  type: string
                  example: player_pre_roll
      responses:
        '204':
          description: Event tracked

  /api/v1/movies/{movieID}/ratings/summary:
    get:
      tags:
        - Engagement
      summary: Get Movie Rating Summary
      security: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Average rating and review count
          content:
            application/json:
              schema:
                type: object
                properties:
                  average:
                    type: number
                    format: float
                    example: 8.4
                  count:
                    type: integer
                    example: 1250

  /api/v1/movies/{movieID}/ratings:
    post:
      tags:
        - Engagement
      summary: Rate a Movie
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 9
      responses:
        '200':
          description: Rating saved
          content:
            application/json:
              example:
                status: rated

  /api/v1/favorites:
    get:
      tags:
        - Engagement
      summary: List User Favorite Movies
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: User favorite items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorite'

  /api/v1/favorites/{movieID}:
    put:
      tags:
        - Engagement
      summary: Add Movie to Favorites
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Movie added to favorites
          content:
            application/json:
              example:
                status: added
    delete:
      tags:
        - Engagement
      summary: Remove Movie from Favorites
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Movie removed from favorites

  /api/v1/watch-history:
    get:
      tags:
        - Watch History
      summary: List Movie Watch History
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Watch history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WatchHistory'
                  limit:
                    type: integer
                  offset:
                    type: integer

  /api/v1/watch-history/{movieID}:
    get:
      tags:
        - Watch History
      summary: Get Watch Progress for Movie
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Watch progress record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchHistory'
        '404':
          description: History record not found
    put:
      tags:
        - Watch History
      summary: Update Movie Watch Progress
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - progress_seconds
                - duration_seconds
              properties:
                progress_seconds:
                  type: integer
                  example: 1800
                duration_seconds:
                  type: integer
                  example: 7200
      responses:
        '200':
          description: Progress saved
          content:
            application/json:
              example:
                status: saved
    delete:
      tags:
        - Watch History
      summary: Delete Movie Watch Progress
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: History deleted

  /api/v1/watch-history/episodes:
    get:
      tags:
        - Watch History
      summary: List Episode Watch History
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Episode watch history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EpisodeWatchHistory'
                  limit:
                    type: integer
                  offset:
                    type: integer

  /api/v1/watch-history/episodes/{episodeID}:
    put:
      tags:
        - Watch History
      summary: Update Episode Watch Progress
      security:
        - bearerAuth: []
      parameters:
        - name: episodeID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - progress_seconds
                - duration_seconds
              properties:
                progress_seconds:
                  type: integer
                  example: 1200
                duration_seconds:
                  type: integer
                  example: 2700
      responses:
        '200':
          description: Progress saved
          content:
            application/json:
              example:
                status: saved
    delete:
      tags:
        - Watch History
      summary: Delete Episode Watch Progress
      security:
        - bearerAuth: []
      parameters:
        - name: episodeID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: History deleted

  /api/v1/notifications:
    get:
      tags:
        - Notifications (User)
      summary: List Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

  /api/v1/notifications/{id}/read:
    patch:
      tags:
        - Notifications (User)
      summary: Mark Notification As Read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Marked as read

  /api/v1/notifications/read-all:
    post:
      tags:
        - Notifications (User)
      summary: Mark All Notifications As Read
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All marked as read

  /api/v1/admin/dashboard:
    get:
      tags:
        - Admin Dashboard & Analytics
      summary: Admin Dashboard Counts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Entity totals
          content:
            application/json:
              example:
                users: 1540
                movies: 320
                series: 85
                episodes: 1250

  /api/v1/admin/analytics:
    get:
      tags:
        - Admin Dashboard & Analytics
      summary: System Analytics
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          description: Analytics timeframe (7, 30 or 90)
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
      responses:
        '200':
          description: Aggregated analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  range_days:
                    type: integer
                  generated_at:
                    type: string
                    format: date-time
                  summary:
                    type: object
                  daily:
                    type: array
                    items:
                      type: object
                  top_movies:
                    type: array
                    items:
                      type: object

  /api/v1/admin/audit-logs:
    get:
      tags:
        - Admin Audit Logs
      summary: Query Audit Logs
      security:
        - bearerAuth: []
      parameters:
        - name: actor_user_id
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
            enum: [POST, PUT, PATCH, DELETE]
        - name: resource_type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Audit log trail
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  pagination:
                    type: object

